volumes:
  redis-prod-data:
    name: "tensorstorage-redis-data"

x-tensorstorage: &tensorstorage
    image: tensorstorage
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${BT_WALLETS_PATH}:/root/.bittensor/wallets
      - ./scripts:/install/scripts
    env_file:
      - .env
    network_mode: host

services:
  tensorstorage-miner:
    <<: *tensorstorage
    volumes:
      - ${BT_WALLETS_PATH}:/root/.bittensor/wallets
      - ${TENSORSTORAGE_MINER_DATA_DIR}:/root/.data/
    environment:
      - TENSORSTORAGE_NODE=miner
    env_file:
      - .env
      - path: tensorstorage-miner.env
        required: false

  tensorstorage-validator:
    <<: *tensorstorage
    depends_on:
      tensorstorage-api:
        condition: service_started
    environment:
      - TENSORSTORAGE_NODE=validator
    env_file:
      - .env
      - path: tensorstorage-validator.env
        required: false

  tensorstorage-api:
    <<: *tensorstorage
    environment:
      - TENSORSTORAGE_NODE=api
    env_file:
      - .env
      - path: tensorstorage-api.env
        required: false

  redis:
    image: redis:7.2.4-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "incr", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    command:
      - redis-server
      - /etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-prod-data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
